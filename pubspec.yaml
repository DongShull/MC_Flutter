name: mc_flutter
description: MovieClaw Android client rewritten in Flutter (1:1 feature parity).
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.8.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1          # 状态管理
  go_router: ^14.2.0                # 路由
  dio: ^5.7.0                       # 网络三通道
  freezed_annotation: ^3.0.0        # 核心 API 模型（P1：McApi 响应/请求模型生成式解析）
  json_annotation: ^4.9.0           # 同上
  video_player: ^2.9.1              # AV Player 底层引擎（Android=ExoPlayer）
  flutter_secure_storage: ^9.2.2    # 凭证安全存储（对应 mc_vault）
  shared_preferences: ^2.3.2        # 轻量偏好
  cached_network_image: ^3.4.1      # 海报缓存
  intl: ^0.19.0
  wakelock_plus: ^1.5.2
  fl_chart: ^1.3.1
  mobile_scanner: ^7.5.0
  url_launcher: ^6.3.0              # 外链/浏览器（对应 Android Custom Tabs）
  share_plus: ^10.0.0               # 系统分享（对应 Android Intent.ACTION_SEND）
  image_picker: ^1.1.2              # 头像选择（对应 Android Photo Picker）

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.5.4             # freezed / json_serializable 代码生成（P1）
  freezed: ^3.2.5                   # 同上
  json_serializable: ^6.12.0         # 同上
  flutter_launcher_icons: ^0.14.1   # 应用图标生成（assets 下尚无 logo，见 flutter_launcher_icons.yaml）
  flutter_native_splash: ^2.4.1     # 启动图生成（assets 下尚无 logo，见 flutter_native_splash.yaml）

flutter:
  uses-material-design: true

  assets:
    - assets/shaders/mc_stretch.frag

  fonts:
    - family: McIcons
      fonts:
        - asset: assets/fonts/McIcons.ttf
    - family: SourceHanSansCN
      fonts:
        - asset: assets/fonts/SourceHanSansCN-Medium.otf
