name: mc_flutter
description: MovieClaw Android client rewritten in Flutter (1:1 feature parity).
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1          # 状态管理
  go_router: ^14.2.0                # 路由
  dio: ^5.7.0                       # 网络三通道
  video_player: ^2.9.1              # AV Player 底层引擎（Android=ExoPlayer）
  flutter_secure_storage: ^9.2.2    # 凭证安全存储（对应 mc_vault）
  shared_preferences: ^2.3.2        # 轻量偏好
  cached_network_image: ^3.4.1      # 海报缓存
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  fonts:
    - family: McIcons
      fonts:
        - asset: assets/fonts/McIcons.ttf
